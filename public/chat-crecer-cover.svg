<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;display=swap');
      .brand-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; fill: #072b61; }
      .hashtag-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; fill: #ffffff; letter-spacing: 0.04em; }
    </style>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid Deep Navy Background (exact hex from user attachment) -->
  <rect width="1920" height="1080" fill="#072b61"/>

  <!-- Centered Speech Bubble Pill -->
  <g transform="translate(960, 520)" filter="url(#subtle-shadow)">
    <!-- White speech bubble pill -->
    <path d="
      M -440 -90
      L 440 -90
      A 90 90 0 0 1 530 0
      A 90 90 0 0 1 440 90
      L -410 90
      L -445 125
      L -440 85
      A 90 90 0 0 1 -530 0
      A 90 90 0 0 1 -440 -90
      Z" 
      fill="#ffffff"/>

    <!-- Left Logo 'C' with Heart inside -->
    <g transform="translate(-370, 0)">
      <!-- Outer C shape -->
      <path d="M 45 -48 A 54 54 0 1 0 45 48 L 28 32 A 34 34 0 1 1 28 -32 Z" fill="#072b61"/>
      <!-- Vibrant Pink/Magenta Heart inside C -->
      <path d="M -2 -14 C -2 -22 -14 -22 -14 -14 C -14 -7 -2 5 -2 8 C -2 5 10 -7 10 -14 C 10 -22 -2 -22 -2 -14 Z" fill="#e6007e" transform="translate(1, -2) scale(1.6)"/>
    </g>

    <!-- Brand Typography "Chat Crecer" -->
    <text x="-260" y="32" font-size="118" class="brand-text" letter-spacing="-0.03em">Chat Crecer</text>
  </g>

  <!-- Hashtag below "#elchatdelembarazo" -->
  <text x="960" y="690" text-anchor="middle" font-size="46" class="hashtag-text">#elchatdelembarazo</text>
</svg>
