<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; fill: #ffffff; }
      .body { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; fill: #ffffff; }
      .step-num { font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; fill: #ffffff; }
      .step-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; fill: #ffffff; }
      .brand { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; fill: #072b61; }
    </style>
  </defs>

  <!-- Left: Navy Background -->
  <rect x="0" y="0" width="950" height="800" fill="#0c2340"/>

  <!-- Right: Vibrant Magenta/Pink Background -->
  <rect x="950" y="0" width="650" height="800" fill="#e6007e"/>

  <!-- LEFT CONTENT -->
  <!-- Chat Crecer Logo Pill -->
  <g transform="translate(100, 70)">
    <path d="M 0 35 L 420 35 A 45 45 0 0 1 465 80 A 45 45 0 0 1 420 125 L 30 125 L 0 145 L 5 120 A 45 45 0 0 1 -45 80 A 45 45 0 0 1 0 35 Z" fill="#ffffff"/>
    <g transform="translate(45, 80)">
      <!-- C shape -->
      <path d="M 28 -28 A 34 34 0 1 0 28 28 L 18 18 A 20 20 0 1 1 18 -18 Z" fill="#072b61"/>
      <!-- Heart -->
      <path d="M -1 -7 C -1 -12 -7 -12 -7 -7 C -7 -3 -1 3 -1 5 C -1 3 5 -3 5 -7 C 5 -12 -1 -12 -1 -7 Z" fill="#e6007e" transform="translate(1, -1) scale(1.4)"/>
    </g>
    <text x="105" y="98" font-size="64" class="brand" letter-spacing="-0.02em">Chat Crecer</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="290" font-size="44" class="title" line-height="1.2">
    <tspan x="100" dy="0">El chat que te acompaña</tspan>
    <tspan x="100" dy="58">durante el embarazo</tspan>
    <tspan x="100" dy="58">y el primer año de tu bebé.</tspan>
  </text>

  <!-- 3 Steps Bar -->
  <g transform="translate(70, 520)">
    <!-- Container -->
    <rect width="810" height="180" rx="12" fill="#08182b" opacity="0.6"/>

    <!-- Step 1: Messenger -->
    <g transform="translate(50, 40)">
      <!-- Messenger Icon Circle -->
      <circle cx="45" cy="45" r="42" fill="#0084ff"/>
      <path d="M 45 22 C 30 22 18 32 18 45 C 18 52 22 58 28 62 L 26 73 L 36 67 C 39 68 42 68 45 68 C 60 68 72 58 72 45 C 72 32 60 22 45 22 Z M 52 40 L 44 49 L 37 42 L 26 53 L 37 44 L 44 51 L 55 40 Z" fill="#ffffff"/>
      <text x="105" y="44" font-size="38" class="step-num">1</text>
      <text x="135" y="32" font-size="18" class="body" fill="#a0b5cc">Entrá a</text>
      <text x="135" y="56" font-size="22" class="step-title">Messenger</text>
    </g>

    <!-- Step 2: Buscá Chat Crecer -->
    <g transform="translate(320, 40)">
      <circle cx="45" cy="45" r="42" fill="#ffffff"/>
      <path d="M 52 28 A 24 24 0 1 0 52 62 L 44 54 A 14 14 0 1 1 44 36 Z" fill="#072b61"/>
      <path d="M 36 41 C 36 38 31 38 31 41 C 31 44 36 48 36 50 C 36 48 41 44 41 41 C 41 38 36 38 36 41 Z" fill="#e6007e"/>
      <text x="105" y="44" font-size="38" class="step-num">2</text>
      <text x="135" y="32" font-size="18" class="body" fill="#a0b5cc">Buscá</text>
      <text x="135" y="56" font-size="22" class="step-title">Chat Crecer</text>
    </g>

    <!-- Step 3: Empezá a Chatear -->
    <g transform="translate(580, 40)">
      <circle cx="45" cy="45" r="42" fill="#0084ff"/>
      <!-- Empezar pill inside -->
      <rect x="18" y="30" width="54" height="30" rx="15" fill="#ffffff"/>
      <text x="45" y="49" text-anchor="middle" font-size="10" font-family="'Inter', sans-serif" font-weight="700" fill="#0084ff">Empezar</text>
      <text x="105" y="44" font-size="38" class="step-num">3</text>
      <text x="135" y="32" font-size="18" class="body" fill="#a0b5cc">Empezá a</text>
      <text x="135" y="56" font-size="22" class="step-title">Chatear</text>
    </g>
  </g>

  <!-- RIGHT CONTENT (Illustration of Mother and Children + Hashtag) -->
  <g transform="translate(1020, 90)">
    <!-- Reminder Notification Balloon -->
    <g transform="translate(380, 50)">
      <circle cx="35" cy="35" r="35" fill="#ffffff" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.15))"/>
      <rect x="20" y="20" width="30" height="26" rx="4" fill="none" stroke="#0c2340" stroke-width="3"/>
      <line x1="26" y1="15" x2="26" y2="22" stroke="#0c2340" stroke-width="3"/>
      <line x1="44" y1="15" x2="44" y2="22" stroke="#0c2340" stroke-width="3"/>
      <circle cx="42" cy="38" r="8" fill="#e6007e"/>
      <line x1="42" y1="34" x2="42" y2="38" stroke="#ffffff" stroke-width="2"/>
      <line x1="42" y1="38" x2="45" y2="38" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Stylized Mother Figure -->
    <!-- Hair -->
    <path d="M 120 180 C 100 80 240 60 250 160 C 265 170 270 220 250 250 C 220 280 180 270 160 250 Z" fill="#0d1b2a"/>
    <!-- Face -->
    <circle cx="210" cy="180" r="48" fill="#fce5d8"/>
    <!-- Gentle smiling face -->
    <ellipse cx="230" cy="172" rx="4" ry="4" fill="#0d1b2a"/>
    <path d="M 220 190 Q 232 205 244 190" fill="none" stroke="#0d1b2a" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Maternity Dress -->
    <path d="M 175 228 C 150 290 130 400 150 510 L 290 510 C 310 400 280 290 245 228 Z" fill="#8ea8d6"/>
    <!-- Pregnant belly curvature -->
    <path d="M 155 330 Q 120 400 155 470" fill="none" stroke="#718cb8" stroke-width="4"/>

    <!-- Mother's Arm holding Phone -->
    <path d="M 240 250 L 320 290 L 325 320 L 250 300 Z" fill="#fce5d8"/>
    <!-- Black Phone with Blue Messenger bubble -->
    <rect x="315" y="270" width="28" height="52" rx="5" fill="#1e1e1e" transform="rotate(15 315 270)"/>
    <rect x="318" y="275" width="22" height="42" rx="2" fill="#0084ff" transform="rotate(15 315 270)"/>

    <!-- Legs & Shoes -->
    <line x1="190" y1="510" x2="190" y2="600" stroke="#fce5d8" stroke-width="12" stroke-linecap="round"/>
    <line x1="240" y1="510" x2="240" y2="600" stroke="#fce5d8" stroke-width="12" stroke-linecap="round"/>
    <path d="M 175 600 L 205 600 L 205 615 L 180 615 Z" fill="#0d1b2a"/>
    <path d="M 235 600 L 265 600 L 265 615 L 240 615 Z" fill="#0d1b2a"/>

    <!-- Baby being held (curly orange hair with pacifier) -->
    <g transform="translate(110, 150)">
      <!-- Curly orange hair -->
      <circle cx="20" cy="20" r="22" fill="#ff7f32"/>
      <circle cx="5" cy="15" r="16" fill="#ff7f32"/>
      <circle cx="35" cy="15" r="16" fill="#ff7f32"/>
      <circle cx="20" cy="5" r="16" fill="#ff7f32"/>
      <!-- Face -->
      <circle cx="20" cy="28" r="20" fill="#fce5d8"/>
      <ellipse cx="26" cy="24" rx="2.5" ry="2.5" fill="#0d1b2a"/>
      <!-- Pacifier -->
      <circle cx="30" cy="34" r="8" fill="#4fc3f7"/>
      <circle cx="30" cy="34" r="4" fill="#ffffff"/>
      <!-- Body wrapped -->
      <path d="M 5 45 C 5 70 30 85 45 80 C 50 65 40 45 25 45 Z" fill="#0d2b45"/>
    </g>

    <!-- Young boy toddler hugging mother's leg -->
    <g transform="translate(230, 320)">
      <!-- Orange hair -->
      <path d="M 30 30 C 10 5 60 -10 80 15 C 95 35 90 70 75 75 Z" fill="#ff6b35"/>
      <circle cx="50" cy="50" r="26" fill="#fce5d8"/>
      <ellipse cx="44" cy="46" rx="3" ry="3" fill="#0d1b2a"/>
      <!-- Smiling open mouth -->
      <circle cx="46" cy="58" r="4" fill="#0d1b2a"/>
      <!-- Arm hugging mom -->
      <path d="M 30 75 L -10 65 L -10 80 L 30 90 Z" fill="#fce5d8"/>
      <!-- Striped shirt & pants -->
      <path d="M 30 75 L 75 80 L 80 170 L 30 165 Z" fill="#1b2a47"/>
      <!-- Striped colorful pants -->
      <rect x="36" y="170" width="16" height="70" fill="#ff6b35"/>
      <rect x="36" y="185" width="16" height="8" fill="#2d6cdf"/>
      <rect x="36" y="205" width="16" height="8" fill="#2d6cdf"/>
      <rect x="36" y="225" width="16" height="8" fill="#2d6cdf"/>
      
      <rect x="56" y="170" width="16" height="70" fill="#ff6b35"/>
      <rect x="56" y="185" width="16" height="8" fill="#2d6cdf"/>
      <rect x="56" y="205" width="16" height="8" fill="#2d6cdf"/>
      <rect x="56" y="225" width="16" height="8" fill="#2d6cdf"/>
    </g>
  </g>

  <!-- Bottom Right Hashtag -->
  <text x="1420" y="745" text-anchor="middle" font-size="34" class="title" letter-spacing="0.02em">#ElChatDelEmbarazo</text>
</svg>
